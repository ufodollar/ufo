<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Relay reachability</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; padding:20px 18px 40px; font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif;
         color:#0f172a; background:#fff; }
  h1 { font-size:19px; margin:0 0 6px; letter-spacing:-.2px; }
  p.lead { color:#64748b; font-size:13px; margin:0 0 18px; }
  .row { display:flex; align-items:center; gap:10px; padding:11px 12px; border:1px solid #e8edf4;
         border-radius:12px; margin-bottom:8px; background:#fbfcfe; }
  .dot { width:9px; height:9px; border-radius:50%; flex:0 0 auto; background:#cbd5e1; }
  .dot.ok { background:#16a34a; } .dot.fail { background:#dc2626; } .dot.wait { background:#f59e0b; }
  .name { font-weight:600; font-size:13px; flex:1; min-width:0; }
  .name small { display:block; font-weight:400; color:#94a3b8; font-size:11px; word-break:break-all; }
  .res { font-size:11.5px; color:#64748b; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .verdict { margin-top:16px; padding:13px 14px; border-radius:12px; font-size:13px; line-height:1.6; }
  .verdict.bad { background:#fef2f2; border:1px solid #fecaca; color:#991b1b; }
  .verdict.ok { background:#f0fdf4; border:1px solid #bbf7d0; color:#166534; }
  button { width:100%; margin-top:16px; padding:13px; font:inherit; font-weight:700; font-size:14px;
           background:#1d4ed8; color:#fff; border:none; border-radius:12px; }
</style>
</head>
<body>
<h1>Relay reachability</h1>
<p class="lead">One HTTPS probe per candidate. A blocked host fails at the network layer; a host that answers anything (even a 4xx) is reachable.</p>
<div id="list"></div>
<div id="verdict"></div>
<button id="again">Run again</button>

<script>
const TARGETS = [
  ['OKX Connect',      'https://web3.okx.com/',                    'the one that already works'],
  ['WalletConnect',    'https://relay.walletconnect.org/',          'used by the 8 in-app-browser wallets'],
  ['MetaMask SDK',     'https://socket.api.cx.metamask.io/',        'MetaMask deeplink relay'],
  ['Coinbase Wallet',  'https://x.wallet.coinbase.com/',            'Coinbase SDK relay'],
  ['SafePal deeplink', 'https://link.safepal.io/',                  'only opens the app, no URL'],
  ['Trust deeplink',   'https://link.trustwallet.com/',             'only opens the app, no URL'],
  ['control',          'https://api.github.com/',                   'unrelated host, must pass']
];

const list = document.getElementById('list');
const verdict = document.getElementById('verdict');
const rows = {};

function build() {
  list.innerHTML = '';
  TARGETS.forEach(([name, url, note]) => {
    const el = document.createElement('div');
    el.className = 'row';
    el.innerHTML = `<span class="dot wait"></span>
      <span class="name">${name}<small>${note}</small></span>
      <span class="res">…</span>`;
    list.appendChild(el);
    rows[name] = el;
  });
}

async function probe(name, url, timeoutMs) {
  const el = rows[name];
  const dot = el.querySelector('.dot');
  const res = el.querySelector('.res');
  const t0 = performance.now();
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    await fetch(url, { mode: 'no-cors', cache: 'no-store', redirect: 'follow', signal: ctl.signal });
    dot.className = 'dot ok';
    res.textContent = 'reachable · ' + Math.round(performance.now() - t0) + 'ms';
    return true;
  } catch (e) {
    dot.className = 'dot fail';
    const ms = Math.round(performance.now() - t0);
    res.textContent = (ms < timeoutMs - 500 ? 'blocked · ' : 'timeout · ') + ms + 'ms';
    return false;
  } finally {
    clearTimeout(timer);
  }
}

async function run() {
  build();
  verdict.className = 'verdict';
  verdict.textContent = 'Probing…';
  const results = {};
  await Promise.all(TARGETS.map(async ([name, url]) => {
    results[name] = await probe(name, url, 6000);
  }));

  const control = results['control'];
  const wc = results['WalletConnect'];
  const okx = results['OKX Connect'];
  const mm = results['MetaMask SDK'];
  const cb = results['Coinbase Wallet'];

  const lines = [];
  if (!control) {
    verdict.className = 'verdict bad';
    verdict.textContent = 'Even the unrelated control host fails — this device has no usable connection right now. Turn off any VPN/proxy and run again.';
    return;
  }
  lines.push('OKX Connect: ' + (okx ? 'reachable' : 'blocked'));
  lines.push('WalletConnect relay: ' + (wc ? 'reachable' : 'blocked'));
  lines.push('MetaMask SDK relay: ' + (mm ? 'reachable' : 'blocked'));
  lines.push('Coinbase SDK relay: ' + (cb ? 'reachable' : 'blocked'));

  if (!okx && !wc && !mm && !cb) {
    verdict.className = 'verdict bad';
    verdict.innerHTML = lines.join('<br>') +
      '<br><br><b>No relay is reachable from this network.</b> Nothing that runs on a relay can work here — every wallet has to open this page inside its own browser.';
  } else {
    verdict.className = 'verdict ok';
    verdict.innerHTML = lines.join('<br>') +
      '<br><br><b>These can be wired up:</b> ' +
      [okx && 'OKX', wc && 'WalletConnect', mm && 'MetaMask SDK', cb && 'Coinbase SDK'].filter(Boolean).join(', ');
  }

  verdict.innerHTML += '<br><br>Copy this line back:<br><code>' +
    TARGETS.map(([n]) => n.split(' ')[0] + '=' + (results[n] ? 'ok' : 'fail')).join(' ') +
    ' control=' + (control ? 'ok' : 'fail') + '</code>';
}

document.getElementById('again').addEventListener('click', run);
run();
</script>
</body>
</html>
