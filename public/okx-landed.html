<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>OKX Landing Check</title>
<style>
  :root{
    --bg:#f5f7fb; --card:#fff; --ink:#0f172a; --muted:#64748b;
    --line:#e2e8f0; --blue:#2563eb; --blue-soft:#eff4ff;
    --ok:#0f9d58; --bad:#d93025; --warn:#b45309;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    overflow-x:hidden;margin:0;padding:16px 14px 48px;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  .hero{border-radius:18px;padding:18px 16px;margin-bottom:12px;color:#fff;background:#64748b}
  .hero.ok{background:linear-gradient(135deg,#0f9d58,#0b7a44)}
  .hero.bad{background:linear-gradient(135deg,#d93025,#a81f16)}
  .hero h1{margin:0 0 4px;font-size:20px;letter-spacing:-.02em}
  .hero p{margin:0;font-size:12.5px;opacity:.9;line-height:1.5}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
  .card h2{font-size:13px;margin:0 0 10px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .row{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:10px;font-size:12.5px;padding:4px 0;border-bottom:1px dashed #eef2f7}
  .row:last-child{border-bottom:0}
  .row span:first-child{color:var(--muted);max-width:44%}
  .row span:last-child{text-align:right;overflow-wrap:anywhere;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
  button{
    font:inherit;font-size:13.5px;font-weight:600;border:0;border-radius:10px;
    padding:11px 14px;background:var(--blue);color:#fff;width:100%;cursor:pointer;margin-top:8px;
  }
  button.ghost{background:#fff;color:var(--blue);border:1px solid #c7d7fe}
  button:disabled{opacity:.5}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .big{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:1px}
  .tag.ok{background:#e6f4ea;color:var(--ok)}
  .tag.bad{background:#fce8e6;color:var(--bad)}
  .foot{color:var(--muted);font-size:11.5px;line-height:1.6}
</style>
</head>
<body>

<div class="hero" id="hero">
  <h1 id="hero-title">检查中…</h1>
  <p id="hero-sub">正在读取内置浏览器的注入状态</p>
</div>

<div class="card">
  <h2>页面环境</h2>
  <div class="row"><span>URL</span><span id="e-href">—</span></div>
  <div class="row"><span>baseURI</span><span id="e-base">—</span></div>
  <div class="row"><span>UA</span><span id="e-ua">—</span></div>
  <div class="row"><span>脚本可执行</span><span id="e-js">是</span></div>
</div>

<div class="card">
  <h2>钱包注入</h2>
  <div class="row"><span>window.ethereum</span><span id="e-eth">—</span></div>
  <div class="row"><span>标志位</span><span id="e-flags">—</span></div>
  <div class="row"><span>chainId</span><span id="e-chain">—</span></div>
  <div class="row"><span>accounts</span><span id="e-acc">—</span></div>
  <button id="btn-req">请求授权（eth_requestAccounts）</button>
  <button class="ghost" id="btn-bsc">切到 BNB Smart Chain</button>
</div>

<div class="card">
  <h2>合约连通性</h2>
  <div class="row"><span>UFO totalSupply</span><span id="e-supply">—</span></div>
  <div class="row"><span>USDT balanceOf</span><span id="e-usdt">—</span></div>
  <p class="foot" style="margin:10px 0 0">读的是 BSC 主网真实值。能读出来说明 RPC 与链选择都正常，可以在这个容器里跑发行/销毁。</p>
</div>

<div class="foot">
  判定：<b>provider 存在 + 能切 56</b> → 可替代 ONTO。<b>页面能开但无 provider</b> → 只能当网页用，接不了钱包。
</div>

<script>
(function () {
  var UFO = '0x9CB5e78F88EFfb5315A7B445aFa64790C8e53eaB';
  var USDT = '0x55d398326f99059fF775485246999027B3197955';
  var $ = function (id) { return document.getElementById(id); };

  $('e-href').textContent = location.href;
  $('e-base').textContent = document.baseURI;
  $('e-ua').textContent = navigator.userAgent;

  var eth = window.ethereum;
  var hero = $('hero'), title = $('hero-title'), sub = $('hero-sub');

  if (!eth) {
    hero.className = 'hero bad';
    title.textContent = 'LANDED · 但没有 provider';
    sub.textContent = '页面进来了，说明 deep link 能用；但容器没注入 window.ethereum，连不上钱包。';
    $('e-eth').textContent = '无';
    $('e-flags').textContent = '—';
    $('btn-req').disabled = true;
    $('btn-bsc').disabled = true;
    return;
  }

  hero.className = 'hero ok';
  title.textContent = 'LANDED · provider 已注入';
  sub.textContent = 'deep link 与内置浏览器都通了，继续测授权和链。';

  var flags = ['isOkxWallet', 'isMetaMask', 'isTrust', 'isTokenPocket', 'isBitKeep', 'isImToken', 'isCoinbaseWallet']
    .filter(function (k) { return eth[k]; });
  var isOkx = !!eth.isOkxWallet;

  $('e-eth').textContent = '存在';
  $('e-flags').textContent = flags.length ? flags.join(', ') : '无已知标志位';
  if (isOkx) $('e-flags').innerHTML += '<span class="tag ok">OKX</span>';

  // ---------- chainId ----------
  function shortErr(e) {
    if (!e) return 'unknown';
    return (e.code ? 'code ' + e.code + ' · ' : '') + (e.message || String(e)).slice(0, 90);
  }

  eth.request({ method: 'eth_chainId' }).then(function (cid) {
    var n = parseInt(cid, 16);
    $('e-chain').textContent = n + ' (0x' + n.toString(16) + ')' + (n === 56 ? ' BSC' : '');
    if (n !== 56) {
      $('e-chain').innerHTML += '<span class="tag bad">非 BSC</span>';
    }
  }).catch(function (e) {
    $('e-chain').textContent = '读取失败 · ' + shortErr(e);
  });

  eth.request({ method: 'eth_accounts' }).then(function (accs) {
    if (accs && accs.length) {
      $('e-acc').textContent = accs[0];
      readContracts(accs[0]);
    } else {
      $('e-acc').textContent = '未授权（正常，需点请求授权）';
    }
  }).catch(function (e) {
    $('e-acc').textContent = '读取失败 · ' + shortErr(e);
  });

  $('btn-req').addEventListener('click', function () {
    var b = this;
    b.disabled = true;
    b.textContent = '等待钱包确认…';
    eth.request({ method: 'eth_requestAccounts' }).then(function (accs) {
      $('e-acc').textContent = accs && accs[0] ? accs[0] : '返回空数组';
      b.textContent = '已授权';
      if (accs && accs[0]) readContracts(accs[0]);
    }).catch(function (e) {
      $('e-acc').textContent = '被拒绝/失败 · ' + shortErr(e);
      b.textContent = '请求授权（重试）';
      b.disabled = false;
    });
  });

  $('btn-bsc').addEventListener('click', function () {
    var b = this;
    b.disabled = true;
    b.textContent = '切换中…';
    eth.request({
      method: 'wallet_switchEthereumChain',
      params: [{ chainId: '0x38' }]
    }).then(function () {
      $('e-chain').textContent = '56 (0x38) BSC';
      b.textContent = '已在 BSC';
    }).catch(function (e) {
      $('e-chain').textContent = '切换失败 · ' + shortErr(e);
      b.textContent = '切到 BNB Smart Chain（重试）';
      b.disabled = false;
    });
  });

  // ---------- 合约读取 ----------
  function padAddr(a) {
    return a.toLowerCase().replace(/^0x/, '').padStart(64, '0');
  }

  function ethCall(to, data) {
    return eth.request({
      method: 'eth_call',
      params: [{ to: to, data: data }, 'latest']
    });
  }

  function readContracts(addr) {
    ethCall(UFO, '0x18160ddd').then(function (r) {
      var v = BigInt(r);
      $('e-supply').textContent = (Number(v) / 1e18).toLocaleString('en-US', { maximumFractionDigits: 6 }) + ' UFO';
      if (v === 0n) $('e-supply').innerHTML += '<span class="tag bad">尚未铸造</span>';
    }).catch(function (e) {
      $('e-supply').textContent = '读取失败 · ' + shortErr(e);
    });

    if (!addr) return;
    ethCall(USDT, '0x70a08231' + padAddr(addr)).then(function (r) {
      var v = BigInt(r);
      $('e-usdt').textContent = (Number(v) / 1e18).toLocaleString('en-US', { maximumFractionDigits: 6 }) + ' USDT';
    }).catch(function (e) {
      $('e-usdt').textContent = '读取失败 · ' + shortErr(e);
    });
  }
})();
</script>
</body>
</html>
