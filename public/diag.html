<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DIAG</title>
<style>
  body { margin:0; padding:24px 18px; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background:#fff; color:#0f172a; }
  h1 { font-size:20px; margin:0 0 4px; }
  .ok { color:#15803d; }
  .bad { color:#b91c1c; }
  table { width:100%; border-collapse:collapse; margin-top:14px; font-size:12.5px; }
  td { padding:7px 0; border-bottom:1px solid #eef2f7; vertical-align:top; }
  td:first-child { color:#64748b; width:38%; }
  code { font-family: ui-monospace, Menlo, monospace; font-size:11.5px; word-break:break-all; }
  .box { margin-top:18px; padding:12px; border-radius:10px; background:#f8fafc; font-size:12.5px; line-height:1.7; }
</style>
</head>
<body>
<h1 id="h">DIAG</h1>
<p id="verdict" style="font-size:13px;color:#64748b;margin:0">static html only — no bundle, no wallet</p>

<table id="t">
  <tr><td>document</td><td><code id="d">…</code></td></tr>
  <tr><td>fetch /</td><td><code id="f">…</code></td></tr>
  <tr><td>fetch js</td><td><code id="b">…</code></td></tr>
  <tr><td>timezone</td><td><code id="z"></code></td></tr>
  <tr><td>ua</td><td><code id="u"></code></td></tr>
</table>

<div class="box" id="hint"></div>

<script>
(function () {
  document.getElementById('d').textContent = 'html parsed at ' + (performance.now() | 0) + 'ms';
  document.getElementById('z').textContent =
    (Intl.DateTimeFormat().resolvedOptions().timeZone || '?') + ' · ' + new Date().toString();
  document.getElementById('u').textContent = navigator.userAgent;

  function get(url) {
    var started = Date.now();
    return fetch(url, { cache: 'no-store' }).then(function (r) {
      return r.text().then(function (txt) {
        return { status: r.status, len: txt.length, ms: Date.now() - started, body: txt };
      });
    });
  }

  get('/').then(function (r) {
    document.getElementById('f').textContent = r.status + ' · ' + r.len + ' bytes · ' + r.ms + 'ms';
    var m = /assets\/index-[A-Za-z0-9_-]+\.js/.exec(r.body);
    if (!m) { document.getElementById('b').textContent = 'no bundle referenced'; return null; }
    return get('/' + m[0]).then(function (j) {
      document.getElementById('b').textContent =
        j.status + ' · ' + j.len + ' bytes · ' + j.ms + 'ms · ' + m[0];
    });
  }).catch(function (e) {
    document.getElementById('f').textContent = 'FAILED · ' + (e && e.message ? e.message : e);
  }).then(function () {
    var ok = document.getElementById('f').textContent.indexOf('200') === 0;
    var v = document.getElementById('verdict');
    v.textContent = ok ? 'network OK — this browser can reach this host'
                       : 'network FAILED — this browser cannot load this host';
    v.className = ok ? 'ok' : 'bad';
    document.getElementById('hint').textContent = ok
      ? 'This page renders, so the browser works. If the app itself is blank while this page is fine, the failure is in the app bundle.'
      : 'Even this static page cannot fetch the site root. The block is at the network or host level, not in the app.';
  });
})();
</script>
</body>
</html>
