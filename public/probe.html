<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PROBE</title>
<style>
  body { margin:0; padding:16px 14px 40px; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background:#fff; color:#0f172a; }
  h1 { font-size:17px; margin:0 0 2px; }
  .sub { font-size:12px; color:#64748b; margin:0 0 12px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td { padding:6px 0; border-bottom:1px solid #eef2f7; vertical-align:top; }
  td:first-child { color:#64748b; width:34%; }
  code { font-family: ui-monospace, Menlo, monospace; font-size:11px; word-break:break-all; }
  .ok { color:#15803d; font-weight:600; }
  .bad { color:#b91c1c; font-weight:600; }
  iframe { width:100%; height:320px; margin-top:14px; border:1px solid #e2e8f0; border-radius:10px; }
  .note { margin-top:12px; font-size:11.5px; color:#94a3b8; line-height:1.7; }
</style>
</head>
<body>
<h1>PROBE</h1>
<p class="sub">loads the real app in a frame and reads back what happened</p>

<table>
  <tr><td>app mounted</td><td><code id="mounted">…</code></td></tr>
  <tr><td>#root children</td><td><code id="kids">…</code></td></tr>
  <tr><td>first text</td><td><code id="text">…</code></td></tr>
  <tr><td>errors</td><td><code id="errs">…</code></td></tr>
  <tr><td>bundle</td><td><code id="bundle">…</code></td></tr>
  <tr><td>viewport</td><td><code id="vp">…</code></td></tr>
  <tr><td>ua</td><td><code id="ua"></code></td></tr>
</table>

<iframe id="frame" src="/"></iframe>
<div class="note">The frame below is the real app. If it is blank while “app mounted” says true, the app rendered nothing visible — that is a layout problem, not a crash.</div>

<script>
(function () {
  document.getElementById('ua').textContent = navigator.userAgent;
  var f = document.getElementById('frame');

  function set(id, v, bad) {
    var el = document.getElementById(id);
    el.textContent = v;
    if (bad === true) el.className = 'bad';
    if (bad === false) el.className = 'ok';
  }

  function report() {
    var w = f.contentWindow;
    var d = null;
    try { d = f.contentDocument; } catch (e) { set('errs', 'cannot read frame: ' + e.message); return; }
    var boot = (w && w.__ufoBoot) || {};
    var root = d.getElementById('root');

    var mounted = !!boot.mounted;
    set('mounted', mounted ? 'yes' : 'NO', mounted);
    set('kids', root ? String(root.childElementCount) : 'no #root', root && root.childElementCount > 0);
    set('text', root ? (root.innerText || '').replace(/\s+/g, ' ').slice(0, 70) || '(empty)' : '—');
    set('errs', (boot.errors && boot.errors.length) ? boot.errors.slice(-3).join(' | ') : 'none');
    set('vp', 'inner ' + w.innerHeight + '×' + w.innerWidth +
              ' · vv ' + (w.visualViewport ? Math.round(w.visualViewport.height) + '×' + Math.round(w.visualViewport.width) : 'n/a'));

    var entry = (w.performance.getEntriesByType('resource') || []).filter(function (e) {
      return /\/assets\/index-.*\.js$/.test(e.name);
    })[0];
    set('bundle', entry
      ? (entry.name.split('/').pop() + ' · ' + Math.round(entry.duration) + 'ms · ' + (entry.transferSize || 0) + 'B')
      : 'not loaded');
  }

  f.addEventListener('load', function () { setTimeout(report, 3500); });
  setTimeout(report, 7000);
})();
</script>
</body>
</html>
