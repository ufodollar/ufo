<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PING</title>
<style>
  html,body{margin:0;padding:0;background:#0b1220;color:#e2e8f0;
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif;
            height:100%;}
  .wrap{min-height:100%;display:-webkit-box;display:-webkit-flex;display:flex;
        -webkit-box-orient:vertical;-webkit-box-direction:normal;-webkit-flex-direction:column;flex-direction:column;
        -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;
        -webkit-box-align:center;-webkit-align-items:center;align-items:center;padding:28px 20px;}
  .big{font-size:64px;font-weight:800;letter-spacing:6px;color:#3b82f6;line-height:1;margin-bottom:18px;}
  .ok{font-size:15px;font-weight:700;color:#22c55e;margin-bottom:26px;letter-spacing:1px;}
  .row{width:100%;max-width:520px;background:#131c2e;border:1px solid #1f2b42;border-radius:12px;
       padding:14px 16px;margin-bottom:12px;}
  .k{font-size:10.5px;letter-spacing:1.6px;color:#64748b;font-weight:700;margin-bottom:8px;}
  .v{font-size:12.5px;line-height:1.7;color:#cbd5e1;word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace;}
</style>
</head>
<body>
<div class="wrap">
  <div class="big">PING</div>
  <div class="ok">THIS PAGE LOADED</div>

  <div class="row"><div class="k">URL</div><div class="v" id="u">-</div></div>
  <div class="row"><div class="k">BROWSER</div><div class="v" id="b">-</div></div>
  <div class="row"><div class="k">SCREEN</div><div class="v" id="s">-</div></div>
</div>

<script>
// 故意只用 ES5：这个页面的唯一使命就是「证明 HTML 能不能被这个浏览器渲染」。
// 一旦它自己也用了新语法，它失败的原因就和被测对象混在一起，测不出东西。
(function () {
  function txt(id, value) {
    var el = document.getElementById(id);
    if (el) el.innerHTML = String(value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  txt('u', location.href);
  txt('b', navigator.userAgent);
  txt('s', window.innerWidth + ' x ' + window.innerHeight);
  document.title = 'PING OK';
})();
</script>
</body>
</html>
