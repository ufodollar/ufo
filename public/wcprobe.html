<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Relay connectivity</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; padding:20px 18px 40px; font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:#f8fafc; color:#0f172a; }
  h1 { font-size:17px; margin:0 0 4px; letter-spacing:-.2px; }
  p.sub { margin:0 0 18px; font-size:12.5px; color:#64748b; }
  .row { display:flex; align-items:center; gap:10px; padding:13px 14px; margin-bottom:9px;
         background:#fff; border:1px solid #e2e8f0; border-radius:12px; }
  .dot { width:9px; height:9px; border-radius:50%; background:#cbd5e1; flex:0 0 auto; }
  .dot.ok { background:#16a34a; } .dot.bad { background:#dc2626; } .dot.run { background:#2563eb; }
  .name { flex:1; font-size:13px; font-weight:600; word-break:break-all; }
  .meta { font-size:11px; color:#64748b; text-align:right; white-space:nowrap; }
  .verdict { margin-top:16px; padding:14px; border-radius:12px; font-size:13px; line-height:1.6;
             background:#eff6ff; border:1px solid #bfdbfe; color:#1d4ed8; font-weight:600; }
  .verdict.good { background:#f0fdf4; border-color:#bbf7d0; color:#15803d; }
  .verdict.bad { background:#fef2f2; border-color:#fecaca; color:#b91c1c; }
  button { width:100%; margin-top:14px; padding:13px; border:1px solid #dbeafe; background:#fff;
           color:#1d4ed8; border-radius:12px; font:inherit; font-size:13px; font-weight:700; }
  pre { margin:14px 0 0; padding:12px; background:#0f172a; color:#e2e8f0; border-radius:10px;
        font-size:11px; line-height:1.5; overflow-x:auto; white-space:pre-wrap; word-break:break-all; }
</style>
</head>
<body>
  <h1>WalletConnect relay check</h1>
  <p class="sub">Opens a raw WebSocket to each relay. No SDK, no wallet involved.</p>

  <div id="list"></div>
  <div id="verdict" class="verdict">Testing…</div>

  <button id="copy" hidden>Copy result</button>
  <pre id="raw" hidden></pre>

<script>
  const TARGETS = [
    { key: 'relay.walletconnect.org', url: 'wss://relay.walletconnect.org', note: 'WalletConnect relay' },
    { key: 'echo (control)', url: 'wss://ws.postman-echo.com/raw', note: 'control: unrelated WSS' }
  ];

  const list = document.getElementById('list');
  const verdict = document.getElementById('verdict');
  const raw = document.getElementById('raw');
  const copyBtn = document.getElementById('copy');
  const started = Date.now();

  const rows = {};
  for (const t of TARGETS) {
    const el = document.createElement('div');
    el.className = 'row';
    el.innerHTML = `<span class="dot run"></span><span class="name">${t.key}</span><span class="meta">…</span>`;
    list.appendChild(el);
    rows[t.key] = { el, dot: el.querySelector('.dot'), meta: el.querySelector('.meta'), note: t.note };
  }

  function test(t) {
    return new Promise((resolve) => {
      const t0 = performance.now();
      let ws = null;
      let settled = false;
      const finish = (ok, msg) => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        try { ws && ws.close(); } catch (e) {}
        resolve({ key: t.key, ok, msg, ms: Math.round(performance.now() - t0) });
      };
      const timer = setTimeout(() => finish(false, 'timeout 8s'), 8000);
      try {
        ws = new WebSocket(t.url);
      } catch (e) {
        return finish(false, 'constructor threw');
      }
      ws.onopen = () => finish(true, 'tcp + tls + upgrade ok');
      ws.onerror = () => finish(false, 'blocked or refused');
      ws.onclose = (e) => finish(false, 'closed ' + e.code);
    });
  }

  function paint(r) {
    const row = rows[r.key];
    row.dot.className = 'dot ' + (r.ok ? 'ok' : 'bad');
    row.meta.textContent = r.ok ? ('OK · ' + r.ms + 'ms') : (r.msg + ' · ' + r.ms + 'ms');
  }

  (async () => {
    const results = [];
    for (const t of TARGETS) {
      const r = await test(t);
      paint(r);
      results.push({ ...r, note: t.note });
    }

    const wc = results[0];
    const ctrl = results[1];
    let text, cls;
    if (wc.ok) {
      text = 'Relay is reachable from this network. The connect stall is NOT a firewall issue.';
      cls = 'good';
    } else if (ctrl.ok) {
      text = 'WebSocket works in general, but the WalletConnect relay does not answer. '
           + 'This network blocks relay.walletconnect.org — the pairing request never gets published.';
      cls = 'bad';
    } else {
      text = 'Neither WebSocket answered. Either all outbound WebSocket traffic is blocked here, '
           + 'or the device is offline. Try again on Wi-Fi or another carrier before concluding.';
      cls = 'bad';
    }
    verdict.className = 'verdict ' + cls;
    verdict.textContent = text;

    const report = [
      'UFO relay check ' + new Date().toISOString(),
      'UA: ' + navigator.userAgent,
      'conn: ' + ((navigator.connection && navigator.connection.effectiveType) || 'n/a'),
      'onLine: ' + navigator.onLine,
      '',
      ...results.map((r) => `${r.key.padEnd(26)} ${r.ok ? 'OK  ' : 'FAIL'} ${r.ms}ms  ${r.msg}  (${r.note})`),
      '',
      text
    ].join('\n');
    raw.textContent = report;
    raw.hidden = false;
    copyBtn.hidden = false;
    copyBtn.onclick = async () => {
      try { await navigator.clipboard.writeText(report); copyBtn.textContent = 'Copied'; }
      catch (e) { copyBtn.textContent = 'Select the text above'; }
    };
  })();
</script>
</body>
</html>
