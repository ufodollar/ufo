<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>UFO Ecosystem</title>
    <meta name="theme-color" content="#f8fafc" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-512.png" />

    <!-- 首屏唯一的后端依赖：RPC。提前建连，省一次 TLS 握手（约 100-200ms）。
         AppKit / WalletConnect 的域名首屏用不到，等真正要加载钱包弹窗时再预热
         （见 src/wallet.js 的 warmup），首屏白拿 2 个多余连接没有意义。 -->
    <link rel="preconnect" href="https://rpc.ankr.com" crossorigin />
    <link rel="dns-prefetch" href="https://rpc.ankr.com" />

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
      html, body {
        background-color: #f8fafc;
        color: #1e293b;
      }
      body {
        /* 先写 100vh 兜底：旧版 WebView（微信 X5、部分钱包内置浏览器）不认 dvh，
           只写 100dvh 会让高度失效，配合下面的 overflow:hidden 就是整页点不动的成因 */
        height: 100vh;
        height: 100dvh;
        display: flex;
        justify-content: center;
        overflow: hidden;
      }
      #root {
        width: 100%;
        max-width: 480px;
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        background-color: #f8fafc;
        position: relative;
      }

      /* AppKit 弹窗（w3m-modal）关闭时不得拦截点击。
         注意判定条件必须是 class="open"：AppKit 用 classList 开关弹窗，
         宿主元素上从来没有 open 属性，写成 :not([open]) 会命中所有状态
         （包括已打开），导致弹窗里每个钱包按钮都点不动。 */
      w3m-modal:not(.open) {
        pointer-events: none !important;
      }

      /* 首屏骨架：内联在 HTML 里，不依赖 JS，脚本下来之前就能看到 */
      .boot {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .boot-ring {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2.5px solid #dbeafe;
        border-top-color: #3b82f6;
        animation: boot-spin 0.8s linear infinite;
      }
      .boot-text {
        font-size: 12px;
        letter-spacing: 0.08em;
        color: #94a3b8;
        font-weight: 600;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-ring { animation: none; border-top-color: #dbeafe; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-ring"></div>
        <div class="boot-text">LOADING</div>
      </div>
    </div>
    <noscript>
      <div style="padding: 40px 24px; text-align: center; color: #64748b; font-size: 14px;">
        This app requires JavaScript. Please enable it and reload the page.
      </div>
    </noscript>
    <script>
      // 自愈：脚本没下载下来 / 加载报错时，不要让人对着一个永远转圈的页面干等
      (function () {
        function fail() {
          var boot = document.querySelector('#root .boot');
          if (!boot) return; // React 已接管，说明正常
          boot.innerHTML =
            '<div style="text-align:center;line-height:1.9">' +
            '<div style="font-size:13px;color:#475569;font-weight:600">页面加载失败</div>' +
            '<div style="font-size:11.5px;color:#94a3b8">请检查网络后重新加载</div>' +
            '</div>' +
            '<button onclick="location.reload()" style="margin-top:6px;padding:9px 22px;border-radius:20px;border:none;background:#3b82f6;color:#fff;font-size:13px;font-weight:700">重新加载</button>';
        }
        setTimeout(fail, 9000);
        window.addEventListener('error', function (e) {
          if (e && e.target && e.target.tagName === 'SCRIPT') fail();
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
