<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>UFO Ecosystem</title>
    <meta name="theme-color" content="#f8fafc" />

    <!-- 首屏要用到的三个后端，提前建好连接，省掉 3 次 TLS 握手（约 200-400ms） -->
    <link rel="preconnect" href="https://rpc.ankr.com" crossorigin />
    <link rel="preconnect" href="https://api.web3modal.org" crossorigin />
    <link rel="preconnect" href="https://relay.walletconnect.org" crossorigin />
    <link rel="dns-prefetch" href="https://rpc.ankr.com" />
    <link rel="dns-prefetch" href="https://api.web3modal.org" />

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
      body {
        background-color: #f8fafc;
        color: #1e293b;
        height: 100dvh;
        display: flex;
        justify-content: center;
        overflow: hidden;
      }
      #root {
        width: 100%;
        max-width: 480px;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        background-color: #f8fafc;
        position: relative;
      }

      /* 首屏骨架：内联在 HTML 里，不依赖 JS，脚本下来之前就能看到 */
      .boot {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .boot-ring {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2.5px solid #dbeafe;
        border-top-color: #3b82f6;
        animation: boot-spin 0.8s linear infinite;
      }
      .boot-text {
        font-size: 12px;
        letter-spacing: 0.08em;
        color: #94a3b8;
        font-weight: 600;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-ring { animation: none; border-top-color: #dbeafe; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-ring"></div>
        <div class="boot-text">LOADING</div>
      </div>
    </div>
    <noscript>
      <div style="padding: 40px 24px; text-align: center; color: #64748b; font-size: 14px;">
        This app requires JavaScript. Please enable it and reload the page.
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
